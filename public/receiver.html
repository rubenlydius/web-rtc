<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC - Receiver</title>
    <style>
        body {
            background: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
    
        #outputCanvas {
            width: 90vw;
            /* 75% of the screen width */
            aspect-ratio: 16 / 9;
            /* Standard widescreen ratio */
            background: #111;
            display: block;
    
            /* The Magic: This zooms into the vertical feed and crops 
                   the top/bottom to fill the 16:9 box */
            object-fit: cover;
    
            border: 2px solid #333;
        }
    
        #otherCamera,
        #hiddenCanvas {
            display: none;
        }
    
        #qrcode {
            padding: 10px;
            background: white;
        }
    
        </style>
</head>

<body>
    <div id="ui-layer">
        <h1>Laptop Display (Receiver)</h1>
        <p>Scan this QR code with your phone:</p>
        <div id="qrcode"></div>
    </div>

    <video id="otherCamera" playsinline autoplay muted></video>
    <canvas id="hiddenCanvas"></canvas>
    <canvas id="outputCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <script type="module">
        import { drawASCII } from './ascii-filter.js';

        let currentHue = 0;
        let currentFontSize = 7; // Add a stored font size state, defaulting to 7

        const $otherCamera = document.getElementById('otherCamera');
        const $qrContainer = document.getElementById('qrcode');
        const hiddenCtx = document.getElementById('hiddenCanvas').getContext('2d', { willReadFrequently: true });
        const outputCtx = document.getElementById('outputCanvas').getContext('2d');

        let socket;
        let peer;

        const startFilterLoop = () => {
            if ($otherCamera.videoWidth > 0) {
                // Pass the currentFontSize dynamically instead of hardcoding '7'
                drawASCII($otherCamera, hiddenCtx, outputCtx, currentHue, currentFontSize);
            }

            requestAnimationFrame(startFilterLoop);
        };

        const init = async () => {
            initSocket();
            // Start the loop immediately; it will just draw nothing until the video starts
            startFilterLoop();
        };

        const initSocket = () => {
            socket = io.connect(`/`);
            socket.on(`connect`, () => {
                const senderUrl = `${window.location.origin}/sender.html?receiverId=${socket.id}`;
                const qr = qrcode(0, 'L');
                qr.addData(senderUrl);
                qr.make();
                $qrContainer.innerHTML = qr.createImgTag(6);
            });

            socket.on('update_color', (hue) => {
                currentHue = hue; // Update the color when the phone moves the slider
            });

            socket.on('update_size', (size) => {
                // Parse it to make sure it's read as an integer, not a string!
                currentFontSize = parseInt(size, 10);
            });

            socket.on('signal', async (myId, signal, peerId) => {
                if (signal.type === 'offer') {
                    // Hide the UI text and QR once stream begins
                    document.getElementById('ui-layer').style.display = 'none';
                    answerPeerOffer(myId, signal, peerId);
                } else if (peer) {
                    peer.signal(signal);
                }
            });

            socket.on('peer_disconnected', (disconnectedId) => {
                // If the QR code is currently hidden, it means we were in a session.
                // We reload to get back to the start state immediately.
                if ($qrContainer.style.display === 'none') {
                    console.log("Peer left the building. Resetting now.");
                    location.reload();
                }
            });

            socket.on('take_photo', () => {
                // 1. Get the canvas element
                const canvas = document.getElementById('outputCanvas');

                // 2. Convert the canvas drawing into a PNG image data URL
                const imageURL = canvas.toDataURL('image/png');

                // 3. Create a temporary, invisible link element
                const downloadLink = document.createElement('a');

                // 4. Set the filename (using a timestamp so they don't overwrite)
                downloadLink.download = `ascii-art-${Date.now()}.png`;
                downloadLink.href = imageURL;

                // 5. Simulate a click to trigger the download, then clean up
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            });
        };

        const answerPeerOffer = async (myId, offer, peerId) => {
            peer = new SimplePeer({ initiator: false });
            peer.on('signal', data => {
                socket.emit('signal', peerId, data);
            });
            peer.on('stream', stream => {
                $otherCamera.srcObject = stream;
                $otherCamera.play();
            });
            peer.on('close', () => {
                console.log("Peer disconnected, resetting...");
                location.reload();
            });

            peer.on('error', (err) => {
                console.error("Peer error:", err);
                location.reload();
            });

            peer.signal(offer);
        };

        init();
    </script>
</body>

</html>
