<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC - Sender</title>
    <style>
        body {
            background: #111;
            display: flex;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    
        #myCamera {
            display: none;
        }
    
        .slider-container {
            width: 100%;
            padding: 0 30px;
        }
    
        #hueSlider {
            -webkit-appearance: none;
            width: 100%;
            height: 25px;
            border-radius: 15px;
            /* The color spectrum background */
            background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
            outline: none;
        }
    
        /* Removes the blue 'fill' on the left side in Chrome/Safari/mobile */
        #hueSlider::-webkit-slider-runnable-track {
            background: transparent;
        }
    
        #hueSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            border: 3px solid #111;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }


        /* Add labels so you know which slider is which */
        label {
            color: white;
            font-family: sans-serif;
            display: block;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        #sizeSlider {
            -webkit-appearance: none;
            width: 100%;
            height: 25px;
            border-radius: 15px;
            background: #555; /* Neutral background for size */
            outline: none;
        }

        #sizeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            border: 3px solid #111;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    
        </style>
</head>

<body>
    <!-- <h1>Phone Control (Sender)</h1> -->
    <video id="myCamera" playsinline autoplay muted></video>
    
    <div class="slider-container">
        <label for="hueSlider">ASCII Color Hue</label>
        <input type="range" id="hueSlider" min="0" max="360" value="0">
    
        <label for="sizeSlider">ASCII Font Size</label>
        <input type="range" id="sizeSlider" min="5" max="30" value="7">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    <script type="module">

        const $myCamera = document.getElementById('myCamera');
        const $hueSlider = document.getElementById('hueSlider'); // Add this reference

        let socket;
        let myStream;
        let peer;

        // Get the target laptop ID from the URL scanned via QR
        const urlParams = new URLSearchParams(window.location.search);
        const receiverId = urlParams.get('receiverId');

        



        const init = async () => {
            if (!receiverId) {
                alert("No receiver ID found. Please scan the QR code from the laptop.");
                return;
            }

            // Grab the phone's back camera
            const constraints = { audio: false, video: { facingMode: "environment", width: 1280, height: 720 } };
            try {
                myStream = await navigator.mediaDevices.getUserMedia(constraints);
                $myCamera.srcObject = myStream;
                $myCamera.onloadedmetadata = () => $myCamera.play();

                // Once camera is ready, connect to socket
                initSocket();
            } catch (err) {
                console.error("Camera access denied or unavailable", err);
                alert("Camera access is required.");
            }
        };

        const initSocket = () => {
                socket = io.connect('/');

                socket.on('connect', () => {
                    console.log("Connected to server, initiating call to:", receiverId);

                    const hueSlider = document.getElementById('hueSlider');
                    hueSlider.addEventListener('input', () => {
                        // Send the hue value to the specific receiverId
                        socket.emit('update_color', receiverId, hueSlider.value);
                    });

                    // Add this specific block for your new slider:
                    const sizeSlider = document.getElementById('sizeSlider');
                    sizeSlider.addEventListener('input', () => {
                        // Send the font size value to the specific receiverId
                        socket.emit('update_size', receiverId, sizeSlider.value);
                    });

                    callPeer(receiverId);
                });

                socket.on('signal', async (myId, signal, peerId) => {
                    console.log(`Received signal from ${peerId}`);
                    peer.signal(signal);
                });
        };

        const callPeer = async (peerId) => {
            // The phone is the initiator
            peer = new SimplePeer({ initiator: true, stream: myStream });

            peer.on('signal', data => {
                socket.emit('signal', peerId, data);
            });
        };

        init();

    </script>
</body>

</html>
